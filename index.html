<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>报表编辑器</title>
    <script>
      // 页面一开解析就打点：用来区分「WebView 建窗口 + 加载 HTML」和「加载 JS」谁慢
      window.__startupHtml = performance.now();
    </script>
    <!--
      启动占位：React 挂载前先把底色和 loading 画出来，
      避免窗口先白屏、再突然出现界面。样式必须内联，不能等 Tailwind 打包产物。
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f1f1f1;
        overflow: hidden;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f1f1f1;
        color: #475569;
        font:
          13px/1.5 system-ui,
          "Microsoft YaHei",
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      #boot .boot-title {
        font-size: 14px;
        letter-spacing: 0.08em;
      }
      #boot .boot-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid #cbd5e1;
        border-top-color: #64748b;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="boot" aria-hidden="true">
        <div class="boot-title">报表编辑器</div>
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module">
      // 内联 module：在主 bundle 之前执行，差值 ≈ 主包加载 + 解析 + 执行
      window.__startupModuleBoot = performance.now();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
